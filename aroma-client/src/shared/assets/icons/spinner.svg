<svg width="20" height="20" viewBox="0 0 20 20">
  <circle
    cx="10"
    cy="10"
    r="8"
    fill="none"
    stroke="#CF975E"
    stroke-width="2"
    stroke-dasharray="15 8"
    stroke-linecap="round">
    <animateTransform
      attributeName="transform"
      type="rotate"
      from="0 10 10"
      to="360 10 10"
      dur="1.2s"
      repeatCount="indefinite"/>
  </circle>
</svg>